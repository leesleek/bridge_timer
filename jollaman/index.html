<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0014">
<title>졸라맨 런</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0014;
    --neon-pink: #ff2bd6;
    --neon-cyan: #22f3ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at center, #1a0033 0%, #0a0014 60%, #000 100%);
  }
  #cabinet {
    position: relative;
    border-radius: 14px;
    box-shadow:
      0 0 0 3px #2a0a4a,
      0 0 0 6px #120022,
      0 0 30px 6px rgba(255, 43, 214, .45),
      0 0 70px 10px rgba(34, 243, 255, .18);
    overflow: hidden;
    line-height: 0;
  }
  canvas { display: block; }
  /* CRT scanlines + vignette */
  #cabinet::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
    mix-blend-mode: multiply;
  }
  #cabinet::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: linear-gradient(180deg, rgba(255,255,255,.05), transparent 30%);
    animation: flicker 4s infinite steps(1);
  }
  @keyframes flicker { 0%, 97% { opacity: 1; } 98% { opacity: .6; } 99% { opacity: 1; } }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    align-items: center; justify-content: center; text-align: center;
    color: #fff; font: 18px/1.8 "Black Han Sans", sans-serif;
    background: rgba(10, 0, 20, .92);
  }
  @media (orientation: portrait) and (max-width: 700px) {
    #rotate.show { display: flex; }
  }
</style>
</head>
<body>
  <div id="cabinet"><canvas id="game"></canvas></div>
  <div id="rotate" class="show"><div>📱↻<br>가로로 돌리면 더 크게 즐길 수 있어요!<br><small>(탭하면 그냥 시작)</small></div></div>
  <script src="game.js"></script>
</body>
</html>
